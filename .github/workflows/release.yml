name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not $v -or $v -eq "${{ github.ref_name }}") { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          dotnet publish src/Kitsune.App/Kitsune.App.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:Version=$v -o dist/Kitsune
          dotnet publish src/Kitsune.Cli/Kitsune.Cli.csproj -c Release -r win-x64 --self-contained true -p:DebugType=none -p:Version=$v -o dist/Kitsune
          Compress-Archive -Path dist/Kitsune/* -DestinationPath "dist/Kitsune-$v-win-x64.zip"
          Get-FileHash "dist/Kitsune-$v-win-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Kitsune-$v-win-x64.zip" } | Set-Content "dist/Kitsune-$v-win-x64.zip.sha256"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Kitsune-*-win-x64.zip
            dist/Kitsune-*-win-x64.zip.sha256
          generate_release_notes: true
